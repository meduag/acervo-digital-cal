<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACERVO DIGITAL CAL | Engenharia & Inspeção</title>
    <!-- Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-dark: #020617;
            --card-dark: #0f172a;
            --accent: #3b82f6;
        }
        
        body {
            background-color: var(--bg-dark);
            color: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1e293b 0%, #020617 100%);
            --poster-color: transparent;
        }

        #progress-bar {
            width: 0%;
            height: 4px;
            background-color: var(--accent);
            position: absolute;
            bottom: 0;
            left: 0;
            transition: width 0.3s ease;
            z-index: 30;
        }

        .view-cube-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 120px;
            height: 120px;
            perspective: 600px;
            z-index: 40;
            pointer-events: none;
        }
        .cube {
            width: 60px;
            height: 60px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-30deg) rotateY(-45deg);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            margin: 30px auto;
            pointer-events: auto;
        }
        .cube-face {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(30, 41, 59, 0.9);
            color: #94a3b8;
            font-size: 9px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            cursor: pointer;
            backface-visibility: visible;
            transition: all 0.2s;
            user-select: none;
        }
        .cube-face:hover { background: var(--accent); color: white; border-color: white; }
        
        .front  { transform: translateZ(30px); }
        .back   { transform: rotateY(180deg) translateZ(30px); }
        .right  { transform: rotateY(90deg) translateZ(30px); }
        .left   { transform: rotateY(-90deg) translateZ(30px); }
        .top    { transform: rotateX(90deg) translateZ(30px); }
        .bottom { transform: rotateX(-90deg) translateZ(30px); }

        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .model-thumb {
            width: 48px;
            height: 48px;
            background: #020617;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        #catalog-drawer, #sidebar {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sidebar-toggle {
            position: absolute;
            right: -12px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 60;
            width: 24px;
            height: 48px;
            background: var(--card-dark);
            border: 1px solid rgba(255,255,255,0.1);
            border-left: none;
            border-radius: 0 8px 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        
        .admin-only { display: none !important; }
        .is-admin .admin-only { display: flex !important; }
        
        .loading-spinner {
            border: 2px solid rgba(255,255,255,0.1);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

    <!-- ECRÃ DE BOAS-VINDAS -->
    <div id="landing-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-950 p-6 transition-all duration-700">
        <div class="max-w-4xl w-full text-center">
            <div class="mb-8 inline-flex p-5 rounded-full bg-blue-600/10 text-blue-500 border border-blue-500/20 shadow-[0_0_50px_-12px_rgba(59,130,246,0.5)]">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21 8-9-4-9 4V16l9 4 9-4V8z"/><path d="m3 8 9 4 9-4"/><path d="M12 12v8"/></svg>
            </div>
            <h1 class="text-6xl md:text-8xl font-black mb-6 tracking-tighter bg-gradient-to-b from-white to-slate-500 bg-clip-text text-transparent uppercase text-wrap">
                ACERVO DIGITAL CAL
            </h1>
            <p class="text-slate-400 text-lg md:text-xl mb-12 max-w-2xl mx-auto font-light leading-relaxed italic">
                Visualizador de gêmeos digitais do Acervo da CAL.
            </p>
            
            <div class="flex flex-col md:flex-row gap-6 justify-center items-center">
                <button onclick="enterApp()" class="px-10 py-4 bg-blue-600 hover:bg-blue-500 rounded-full font-bold transition-all transform hover:scale-105 active:scale-95 shadow-2xl shadow-blue-600/20">
                    Abrir Visualizador
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DE LOGIN ADMIN -->
    <div id="modal-admin-login" class="fixed inset-0 z-[120] hidden items-center justify-center bg-black/90 backdrop-blur-md p-4">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-8 flex flex-col items-center gap-6">
            <div class="p-4 bg-blue-600/20 rounded-full text-blue-500">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <h2 class="text-xl font-bold uppercase tracking-widest text-center text-white">Acesso Admin</h2>
            <div class="w-full space-y-2">
                <input type="password" id="admin-pass-input" placeholder="Password: admin123" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm text-center outline-none focus:ring-2 ring-blue-500 transition-all text-white">
                <p id="login-error" class="text-[10px] text-red-500 text-center font-bold hidden">Senha incorreta.</p>
            </div>
            <div class="w-full flex flex-col gap-2">
                <button onclick="checkAdminPassword()" class="w-full py-3 bg-blue-600 rounded-xl font-bold hover:bg-blue-500 transition-all shadow-xl shadow-blue-600/20 text-white">Desbloquear</button>
                <button onclick="closeAdminLogin()" class="w-full py-2 text-xs text-slate-400 hover:text-white transition-colors">Voltar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE FORMULÁRIO -->
    <div id="modal-form" class="fixed inset-0 z-[110] hidden items-center justify-center bg-black/80 backdrop-blur-sm p-4">
        <div class="glass-panel w-full max-w-2xl rounded-3xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-white/10 flex justify-between items-center">
                <h2 id="modal-title" class="text-xl font-bold uppercase tracking-tight text-white">Catalogação</h2>
                <button onclick="closeFormModal()" class="p-2 hover:bg-white/10 rounded-full transition-colors text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6">
                <div id="url-field-container" class="space-y-1">
                    <label class="text-[10px] uppercase text-blue-400 font-bold ml-1">URL do Modelo (.glb)</label>
                    <input type="text" id="field-url" placeholder="https://..." class="w-full bg-slate-900 border border-blue-500/30 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 ring-blue-500 font-mono text-white">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-slate-500 font-bold ml-1">Título</label>
                        <input type="text" id="field-title" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 ring-blue-500 text-white">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-slate-500 font-bold ml-1">Autoria</label>
                        <input type="text" id="field-author" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 ring-blue-500 text-white">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-slate-500 font-bold ml-1">Cronologia</label>
                        <input type="text" id="field-date" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 ring-blue-500 text-white">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] uppercase text-slate-500 font-bold ml-1">Local</label>
                        <input type="text" id="field-local" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 ring-blue-500 text-white">
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-slate-500 font-bold ml-1">Descrição</label>
                    <textarea id="field-desc" rows="3" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 ring-blue-500 text-white"></textarea>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-slate-500 font-bold ml-1">Histórico</label>
                    <textarea id="field-hist" rows="2" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 ring-blue-500 text-white"></textarea>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] uppercase text-slate-500 font-bold ml-1">Aquisição</label>
                    <input type="text" id="field-acq" class="w-full bg-slate-900 border border-white/10 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 ring-blue-500 text-white">
                </div>
            </div>
            <div class="p-6 border-t border-white/10 bg-slate-900/50 flex justify-end gap-3">
                <button onclick="closeFormModal()" class="px-6 py-2 rounded-xl text-sm font-bold text-slate-400 hover:text-white transition-colors">Cancelar</button>
                <button id="save-btn" onclick="saveModelData()" class="px-8 py-2 bg-blue-600 rounded-xl text-sm font-bold hover:bg-blue-500 transition-all shadow-lg text-white">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="h-16 bg-slate-950 border-b border-slate-800 px-6 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-3 cursor-pointer" onclick="location.reload()">
            <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center font-black text-sm text-white">CAL</div>
            <span class="font-bold tracking-tight text-lg uppercase text-white">ACERVO DIGITAL <span class="text-blue-500">CAL</span></span>
        </div>
        <div class="flex gap-4 items-center">
            <span id="load-status" class="text-[9px] font-mono text-slate-500 hidden md:block uppercase tracking-widest bg-slate-900 px-3 py-1 rounded-full border border-white/5">Público</span>
            <div class="admin-only flex gap-2">
                <button onclick="initUrlFlow()" class="bg-blue-600 hover:bg-blue-500 px-4 py-1.5 rounded-lg text-xs font-bold transition-all shadow-lg text-white">
                    + Adicionar Modelo (URL)
                </button>
            </div>
            <button onclick="openAdminLogin()" class="p-2 glass-panel rounded-xl hover:bg-white/10 transition-all border border-white/10">
                <svg id="lock-icon-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-slate-400"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden relative">
        <aside id="sidebar" class="absolute inset-y-0 left-0 w-80 bg-slate-950 border-r border-slate-800 flex flex-col shrink-0 z-50">
            <div class="sidebar-toggle" onclick="toggleSidebar()">
                <svg id="sidebar-arrow" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </div>
            <div class="p-5 border-b border-slate-800">
                <input type="text" id="search" oninput="renderRepository()" placeholder="Procurar..." class="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2 text-sm focus:ring-2 ring-blue-500 outline-none text-white">
            </div>
            <div id="model-list" class="flex-1 overflow-y-auto p-4 space-y-2"></div>
            <div class="p-6 bg-slate-900/50 border-t border-slate-800">
                <h3 class="text-[9px] font-bold text-slate-500 uppercase mb-4 tracking-widest text-center">Controle Visual</h3>
                <div class="space-y-4">
                    <div><input id="metallic" type="range" min="0" max="1" step="0.01" value="1" class="w-full accent-blue-500 h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer"></div>
                    <div><input id="roughness" type="range" min="0" max="1" step="0.01" value="1" class="w-full accent-blue-500 h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer"></div>
                </div>
            </div>
        </aside>

        <section class="flex-1 relative overflow-hidden bg-black w-full h-full">
            <div class="absolute top-6 left-16 z-40" id="home-btn-container">
                <button onclick="resetCamera()" class="glass-panel p-3 rounded-xl hover:bg-blue-600 transition-all border border-white/10 active:scale-95 text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-slate-300"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                </button>
            </div>

            <div class="view-cube-container">
                <div class="cube" id="cube">
                    <div class="cube-face front" onclick="rotateTo('0deg 90deg 105%')">Front</div>
                    <div class="cube-face back" onclick="rotateTo('180deg 90deg 105%')">Back</div>
                    <div class="cube-face right" onclick="rotateTo('-90deg 90deg 105%')">Right</div>
                    <div class="cube-face left" onclick="rotateTo('90deg 90deg 105%')">Left</div>
                    <div class="cube-face top" onclick="rotateTo('0deg 0deg 105%')">Top</div>
                    <div class="cube-face bottom" onclick="rotateTo('0deg 180deg 105%')">Bottom</div>
                </div>
            </div>

            <div id="info-overlay" class="absolute bottom-10 left-10 z-20 pointer-events-none hidden">
                <div class="glass-panel p-4 rounded-2xl flex items-center gap-4 shadow-2xl pointer-events-auto border border-white/10">
                    <div><h2 id="active-title" class="text-lg font-black text-white leading-tight uppercase">Modelo</h2></div>
                    <button onclick="toggleCataloging()" class="p-3 bg-white/5 hover:bg-blue-600 rounded-xl transition-all border border-white/10 active:scale-90 text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-white"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                    </button>
                </div>
            </div>

            <div id="catalog-drawer" class="absolute inset-y-0 right-0 w-[400px] glass-panel border-l border-white/10 translate-x-full z-[55] flex flex-col shadow-2xl">
                <div class="p-6 border-b border-white/10 flex justify-between items-center bg-slate-900/30">
                    <h3 class="text-lg font-black uppercase italic tracking-tighter text-white">Ficha Técnica</h3>
                    <div class="flex gap-2">
                        <button onclick="openEditForm()" class="admin-only p-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl transition-all shadow-lg text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-white"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                        </button>
                        <button id="delete-btn" onclick="deleteActiveModel()" class="admin-only p-2.5 bg-red-600/20 hover:bg-red-600 rounded-xl transition-all text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                        <button onclick="toggleCataloging()" class="p-2.5 hover:bg-white/10 rounded-xl text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>
                </div>
                <div id="catalog-content" class="flex-1 overflow-y-auto p-8 space-y-8"></div>
            </div>

            <model-viewer id="viewer" src="" shadow-intensity="2" exposure="1" environment-image="neutral" camera-controls auto-rotate-delay="0" interaction-prompt="none" loading="eager" interpolation-decay="200" ar>
                <div id="progress-bar" slot="progress-bar"></div>
            </model-viewer>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc, query } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        // --- CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'acervo-cal-prod';

        const viewer = document.getElementById('viewer');
        const cube = document.getElementById('cube');
        const sidebar = document.getElementById('sidebar');
        const listContainer = document.getElementById('model-list');
        const activeTitle = document.getElementById('active-title');
        const catalogDrawer = document.getElementById('catalog-drawer');
        const modalForm = document.getElementById('modal-form');
        const modalAdmin = document.getElementById('modal-admin-login');
        const adminPassInput = document.getElementById('admin-pass-input');
        const loginError = document.getElementById('login-error');
        
        let isAdmin = false;
        let repository = []; 
        let activeItem = null;
        let isEditing = false;
        let user = null;

        const DEFAULT_ORBIT = "45deg 75deg 105%";

        // --- INICIALIZAÇÃO FIREBASE (MANDATÓRIO RULE 3) ---
        const initFirebase = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                onAuthStateChanged(auth, (u) => {
                    user = u;
                    if (user) {
                        console.log("Autenticado como:", user.uid);
                        startDataListener();
                    }
                });
            } catch (error) {
                console.error("Erro na autenticação:", error);
            }
        };

        const startDataListener = () => {
            if (!user) return;
            // RULE 1: Strict Paths
            const acervoRef = collection(db, 'artifacts', appId, 'public', 'data', 'acervo');
            
            onSnapshot(acervoRef, (snapshot) => {
                repository = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderRepository();
            }, (err) => {
                console.error("Erro ao ler dados (Verifique se o utilizador está autenticado):", err);
            });
        };

        // --- SISTEMA ADMIN ---
        window.openAdminLogin = () => {
            if (isAdmin) {
                isAdmin = false;
                document.body.classList.remove('is-admin');
                document.getElementById('lock-icon-svg').style.color = '#94a3b8';
                document.getElementById('load-status').innerText = "Público";
                return;
            }
            modalAdmin.style.display = 'flex';
            adminPassInput.value = '';
            loginError.classList.add('hidden');
        };

        window.closeAdminLogin = () => modalAdmin.style.display = 'none';

        window.checkAdminPassword = () => {
            if (adminPassInput.value === "admin123") {
                isAdmin = true;
                document.body.classList.add('is-admin');
                document.getElementById('lock-icon-svg').style.color = '#3b82f6';
                document.getElementById('load-status').innerText = "ADMIN";
                closeAdminLogin();
            } else {
                loginError.classList.remove('hidden');
            }
        };

        // --- FORMULÁRIO & PERSISTÊNCIA ---
        window.initUrlFlow = () => {
            isEditing = false;
            document.getElementById('modal-title').innerText = "Adicionar Novo Modelo";
            document.getElementById('url-field-container').classList.remove('hidden');
            document.querySelectorAll('#modal-form input, #modal-form textarea').forEach(el => el.value = '');
            modalForm.style.display = 'flex';
        };

        window.openEditForm = () => {
            if (!activeItem) return;
            isEditing = true;
            document.getElementById('modal-title').innerText = "Editar Ficha Técnica";
            const info = activeItem.cataloging;
            document.getElementById('field-url').value = activeItem.url || '';
            document.getElementById('field-title').value = activeItem.name || '';
            document.getElementById('field-author').value = info?.author || '';
            document.getElementById('field-date').value = info?.chronology || '';
            document.getElementById('field-local').value = info?.location || '';
            document.getElementById('field-desc').value = info?.description || '';
            document.getElementById('field-hist').value = info?.history || '';
            document.getElementById('field-acq').value = info?.acquisition || '';
            modalForm.style.display = 'flex';
        };

        window.closeFormModal = () => modalForm.style.display = 'none';

        window.saveModelData = async () => {
            if (!user) {
                console.error("Operação negada: utilizador não autenticado.");
                return;
            }
            
            const saveBtn = document.getElementById('save-btn');
            const originalText = saveBtn.innerText;
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<div class="loading-spinner mx-auto"></div>';

            const data = {
                name: document.getElementById('field-title').value || "Sem Título",
                url: document.getElementById('field-url').value,
                cat: "Nuvem",
                cataloging: {
                    author: document.getElementById('field-author').value,
                    chronology: document.getElementById('field-date').value,
                    location: document.getElementById('field-local').value,
                    description: document.getElementById('field-desc').value,
                    history: document.getElementById('field-hist').value,
                    acquisition: document.getElementById('field-acq').value
                }
            };

            try {
                if (isEditing && activeItem) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'acervo', activeItem.id);
                    await updateDoc(docRef, data);
                } else {
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'acervo');
                    await addDoc(colRef, data);
                }
                closeFormModal();
            } catch (e) {
                console.error("Erro ao salvar:", e);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = originalText;
            }
        };

        window.deleteActiveModel = async () => {
            if (!activeItem || !isAdmin || !user) return;
            if (confirm("Tem certeza que deseja apagar este modelo permanentemente?")) {
                try {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'acervo', activeItem.id);
                    await deleteDoc(docRef);
                    activeItem = null;
                    viewer.src = "";
                    document.getElementById('info-overlay').classList.add('hidden');
                    if (!catalogDrawer.classList.contains('translate-x-full')) toggleCataloging();
                } catch (e) {
                    console.error("Erro ao apagar:", e);
                }
            }
        };

        // --- UI & NAVEGAÇÃO ---
        window.renderRepository = () => {
            const search = document.getElementById('search').value.toLowerCase();
            const filtered = repository.filter(i => i.name.toLowerCase().includes(search));
            listContainer.innerHTML = filtered.length ? '' : '<div class="text-center p-6 text-slate-700 text-xs">Nenhum modelo salvo</div>';
            filtered.forEach(item => {
                const card = document.createElement('div');
                const isActive = activeItem && activeItem.id === item.id;
                card.className = `p-3 rounded-xl border transition-all flex items-center gap-3 cursor-pointer ${isActive ? 'bg-blue-600/10 border-blue-500/50' : 'bg-slate-900/30 border-white/5 hover:border-white/10'}`;
                card.onclick = () => loadModel(item);
                card.innerHTML = `
                    <div class="model-thumb">${item.thumb ? `<img src="${item.thumb}" class="w-full h-full object-cover">` : '<div class="w-full h-full bg-slate-950 flex items-center justify-center text-[8px] font-mono text-blue-500 italic">CLOUD</div>'}</div>
                    <div class="flex-1 min-w-0"><h4 class="text-[11px] font-bold ${isActive ? 'text-blue-400' : 'text-slate-300'} truncate uppercase">${item.name}</h4></div>
                `;
                listContainer.appendChild(card);
            });
        };

        window.loadModel = (item) => {
            activeItem = item;
            viewer.src = item.url;
            activeTitle.innerText = item.name;
            document.getElementById('info-overlay').classList.remove('hidden');
            resetCamera();
            renderRepository();
            if (!catalogDrawer.classList.contains('translate-x-full')) updateCatalogUI();
        };

        window.toggleSidebar = () => {
            const isHidden = sidebar.classList.toggle('-translate-x-full');
            document.getElementById('sidebar-arrow').style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
            document.getElementById('home-btn-container').style.left = isHidden ? '24px' : '64px';
        };

        window.toggleCataloging = () => {
            if (!activeItem) return;
            catalogDrawer.classList.toggle('translate-x-full');
            if (!catalogDrawer.classList.contains('translate-x-full')) updateCatalogUI();
        };

        const updateCatalogUI = () => {
            if (!activeItem || !activeItem.cataloging) return;
            const info = activeItem.cataloging;
            document.getElementById('catalog-content').innerHTML = `
                <div class="space-y-8">
                    <div><label class="text-[9px] text-blue-500 font-black uppercase tracking-widest block mb-2">Identificação</label><p class="text-lg font-black text-white uppercase">${activeItem.name}</p></div>
                    <div><label class="text-[9px] text-slate-500 font-bold block mb-1">AUTOR</label><p class="text-sm text-slate-200">${info.author || '---'}</p></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-[9px] text-slate-500 font-bold block mb-1">DATA</label><p class="text-sm text-slate-200">${info.chronology || '---'}</p></div>
                        <div><label class="text-[9px] text-slate-500 font-bold block mb-1">LOCAL</label><p class="text-sm text-slate-200">${info.location || '---'}</p></div>
                    </div>
                    <div><label class="text-[9px] text-slate-500 font-bold block mb-2">DESCRIÇÃO</label><p class="text-xs text-slate-400 leading-relaxed font-light">${info.description || '---'}</p></div>
                </div>
            `;
        };

        window.resetCamera = () => { viewer.cameraOrbit = DEFAULT_ORBIT; viewer.jumpCameraToGoal(); };
        window.rotateTo = (orbit) => { viewer.cameraOrbit = orbit; viewer.jumpCameraToGoal(); };
        window.enterApp = () => { 
            const ls = document.getElementById('landing-screen');
            ls.style.opacity = '0'; 
            ls.style.pointerEvents = 'none';
            setTimeout(() => ls.style.display = 'none', 700); 
        };

        viewer.addEventListener('camera-change', () => {
            const orb = viewer.getCameraOrbit();
            cube.style.transform = `rotateX(${orb.phi * (180/Math.PI) - 90}deg) rotateY(${-orb.theta * (180/Math.PI)}deg)`;
        });

        // Captura de miniatura automática
        viewer.addEventListener('load', async () => {
            if (!activeItem || activeItem.thumb || !user) return;
            setTimeout(async () => {
                try {
                    const shot = viewer.toDataURL("image/png");
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'acervo', activeItem.id);
                    await updateDoc(docRef, { thumb: shot });
                } catch(e) {
                    console.warn("Falha ao atualizar miniatura (CORS ou permissão):", e);
                }
            }, 1500);
        });

        // Inicializar aplicação
        initFirebase();
    </script>
</body>
</html>
